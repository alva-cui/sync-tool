version: '2'
sql:
  - engine: 'sqlite'
    schema: 'migrations/'
    queries: 'queries/'
    gen:
      go:
        package: 'store'
        out: '/'
        emit_json_tags: true
        emit_interface: false
        emit_exact_table_names: false
        overrides:
          - db_type: 'DATETIME'
            go_type: 'time.Time'
